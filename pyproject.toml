[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "libjupiterli"
version = "0.0.0"
dependencies = [
    "typer",
]

[project.scripts]
libjupiterli = "libjupiterli.cli:main" # libjupiterli cli app

[tool.setuptools.packages.find]
include = ["libjupiterli*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
libjupiterli = ["cpp/*"]
